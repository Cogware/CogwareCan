[package]
name = "cogware-can"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
critical-section = "1.1.3"
paste = "1.0.15"
# The CAN frame and identifier traits. Traits only: no driver is named here,
# and none may be. This crate owns its frame type (see `frame`) so a board is
# free to bring whatever controller it has, and the two meet at a conversion
# both sides state in terms of these traits.
embedded-can = "0.4"
# `embedded_can::nb::Can` reports "no frame yet" and "buffers full" through
# `nb::Error`, so adapting one costs naming the crate the trait already uses.
nb = "1.1"

[dev-dependencies]
# Host tests need a critical-section implementation; firmware provides its own.
critical-section = { version = "1.1.3", features = ["std"] }
